<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Κύματα: 1 και 2 διαστάσεις</title>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;margin:0;background:#f4f6f9;color:#1d2433}
  .wrap{max-width:1400px;margin:0 auto;padding:16px}
  h1{font-size:20px;margin:0 0 10px}
  .tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .tab{font:inherit;font-size:14px;padding:9px 16px;border-radius:10px;border:1px solid #9aa6ba;background:#fff;cursor:pointer;color:#34425a}
  .tab:hover{background:#e9eef6}
  .tab.on{background:#2b6cb0;border-color:#2b6cb0;color:#fff;font-weight:600}
  iframe{width:100%;border:0;display:block;min-height:600px;background:transparent}
</style>
</head>
<body>
<div class="wrap">
  <h1>Κύματα</h1>
  <div class="tabs">
    <button class="tab" id="t1" data-src="kymata_1d.html">1 διάσταση: διάδοση, συμβολή, στάσιμα</button>
    <button class="tab" id="t2" data-src="kymata_2d.html">2 διαστάσεις: συμβολή, στάσιμα, σχήματα Chladni</button>
  </div>
  <iframe id="fr" title="Προσομοίωση κυμάτων" scrolling="no"></iframe>
</div>
<script>
const fr = document.getElementById('fr'), tabs = [document.getElementById('t1'), document.getElementById('t2')];
function show(i) {
  tabs.forEach((b, k) => b.classList.toggle('on', k === i));
  fr.style.height = '700px'; fr.src = tabs[i].dataset.src; // η άλλη προσομοίωση αποφορτώνεται: τρέχει μόνο η επιλεγμένη
  try { history.replaceState(null, '', '#' + (i + 1) + 'd'); } catch (e) {}
}
tabs.forEach((b, i) => b.onclick = () => show(i));
window.addEventListener('message', e => { if (e.source === fr.contentWindow && e.data && e.data.kymataHeight) fr.style.height = Math.ceil(e.data.kymataHeight + 8) + 'px'; });
show(location.hash === '#2d' ? 1 : 0);
</script>
</body>
</html>
